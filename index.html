<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Üşüyen Anime Karakteri</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(#b9d8f0, #eaf6ff);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .scene {
      position: relative;
      width: 500px;
      height: 400px;
    }

    /* Kar taneleri */
    .snow {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .snow span {
      position: absolute;
      top: -30px;
      color: white;
      font-size: 25px;
      animation: snowfall 5s linear infinite;
    }

    .snow span:nth-child(1) { left: 10%; animation-delay: 0s; }
    .snow span:nth-child(2) { left: 25%; animation-delay: 1s; }
    .snow span:nth-child(3) { left: 45%; animation-delay: 2s; }
    .snow span:nth-child(4) { left: 65%; animation-delay: .5s; }
    .snow span:nth-child(5) { left: 85%; animation-delay: 1.5s; }

    @keyframes snowfall {
      to {
        transform: translateY(450px) rotate(360deg);
      }
    }

    /* Zemin */
    .floor {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 100px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 5px 20px #9bb7cc;
    }

    /* Karakter */
    .character {
      position: absolute;
      left: 50%;
      bottom: 100px;
      transform: translateX(-50%);
      width: 150px;
      height: 230px;
      animation: shiver 0.15s infinite;
      transition: 1s;
    }

    @keyframes shiver {
      0% { transform: translateX(-50%) rotate(-1deg); }
      50% { transform: translateX(-50%) rotate(1deg); }
      100% { transform: translateX(-50%) rotate(-1deg); }
    }

    /* Kafa */
    .head {
      position: absolute;
      top: 0;
      left: 25px;
      width: 100px;
      height: 105px;
      background: #ffd2b8;
      border-radius: 50%;
      border: 3px solid #333;
    }

    /* Saç */
    .hair {
      position: absolute;
      top: -15px;
      left: 15px;
      width: 110px;
      height: 70px;
      background: #5b3b75;
      border-radius: 60% 60% 30% 30%;
      z-index: 2;
    }

    .hair::after {
      content: "";
      position: absolute;
      bottom: -25px;
      left: 10px;
      width: 25px;
      height: 45px;
      background: #5b3b75;
      transform: rotate(15deg);
    }

    /* Gözler */
    .eye {
      position: absolute;
      top: 48px;
      width: 12px;
      height: 18px;
      background: #333;
      border-radius: 50%;
      z-index: 3;
    }

    .eye.left { left: 28px; }
    .eye.right { right: 28px; }

    /* Ağız */
    .mouth {
      position: absolute;
      left: 44px;
      top: 76px;
      width: 15px;
      height: 8px;
      border-bottom: 3px solid #333;
      border-radius: 50%;
      z-index: 3;
    }

    /* Gövde */
    .body {
      position: absolute;
      top: 95px;
      left: 20px;
      width: 110px;
      height: 125px;
      background: #7c9ac7;
      border-radius: 35px 35px 20px 20px;
      border: 3px solid #333;
    }

    /* Kollar */
    .arm {
      position: absolute;
      top: 110px;
      width: 35px;
      height: 90px;
      background: #ffd2b8;
      border: 3px solid #333;
      border-radius: 30px;
    }

    .arm.left {
      left: 0;
      transform: rotate(20deg);
    }

    .arm.right {
      right: 0;
      transform: rotate(-20deg);
    }

    /* Battaniye */
    .blanket {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%);
      width: 330px;
      height: 150px;
      background: linear-gradient(135deg, #b78bd4, #8060b0);
      border-radius: 80px 80px 30px 30px;
      border: 4px solid #563d78;
      box-shadow: 0 10px 20px rgba(0,0,0,.2);
      animation: blanketMove 3s ease-in-out infinite;
    }

    @keyframes blanketMove {
      0%, 100% {
        transform: translateX(-50%) scale(1);
      }
      50% {
        transform: translateX(-50%) scale(1.03);
      }
    }

    /* Battaniye deseni */
    .blanket::before {
      content: "✦  ✧  ✦  ✧  ✦";
      position: absolute;
      top: 55px;
      left: 50%;
      transform: translateX(-50%);
      color: #eadcff;
      font-size: 22px;
      white-space: nowrap;
    }

    /* Isı efektleri */
    .warm {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: 230px;
      transform: translateX(-50%);
      color: #ffb86b;
      font-size: 25px;
      opacity: 0;
      animation: warmth 2s ease-in-out infinite;
    }

    @keyframes warmth {
      0% {
        opacity: 0;
        transform: translate(-50%, 20px);
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -30px);
      }
    }

    .text {
      position: absolute;
      bottom: 5px;
      width: 100%;
      text-align: center;
      color: #40516b;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="scene">

    <div class="snow">
      <span>❄</span>
      <span>❄</span>
      <span>❄</span>
      <span>❄</span>
      <span>❄</span>
    </div>

    <div class="floor"></div>

    <!-- Anime karakter -->
    <div class="character">
      <div class="hair"></div>

      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
      </div>

      <div class="body"></div>

      <div class="arm left"></div>
      <div class="arm right"></div>
    </div>

    <!-- Battaniye -->
    <div class="blanket"></div>

    <!-- Isınma efekti -->
    <div class="warm">♨️ ♨️ ♨️</div>

    <div class="text">
      Brrr... Çok soğuk! 🥶 → 🥰
    </div>

  </div>

</body>
</html>
